<p> O Game do Saber surge exatamente para dar voz a uma realidade que muitos alunos enfrentam todos os dias. A rotina na escola não é fácil quando a infraestrutura pede socorro: estudantes lidam com banheiros sem portas que tiram a privacidade, mictórios com defeito, janelas quebradas que deixam o frio e a chuva entrarem nas salas, e uma quadra com rachaduras no meio e tinta descascando que precisa ser pintada de novo para que todos possam jogar em um espaço bonito e seguro.

É no meio desse cenário difícil que o Game do Saber ganha força. Mais do que um projeto, ele se torna uma ferramenta de mobilização. Ao transformar os desafios da escola em etapas de uma grande missão, o jogo une os alunos para mostrar que a comunidade precisa de mudanças reais — desde o conserto da estrutura física até a chegada de novos fones e tecnologias para o aprendizado.</p>
